project_id = "safenow"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["safenow://auth/callback**", "http://localhost:3000/**", "http://127.0.0.1:3000/**", "http://localhost:8081/**"]
minimum_password_length = 10
[auth.email]
enable_signup = true
enable_confirmations = false
[storage]
enabled = true
file_size_limit = "20MiB"
[functions.evidence-upload]
verify_jwt = false
[functions.push-dispatch]
verify_jwt = false
[functions.retention]
verify_jwt = false
[functions.deployment-check]
verify_jwt = false
